<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Pictile Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="./" aria-label="Pictile Studio 首页"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><span>Pictile</span></a>
      <div class="project-title"><span class="project-dot"></span><strong>未命名作品</strong><span id="project-meta">24 × 24 网格</span></div>
      <div class="header-actions">
        <button id="theme-toggle" class="icon-button" type="button" aria-label="切换深色模式" aria-pressed="false">◐</button>
        <label class="secondary-button header-upload" for="image-input">导入图片</label>
        <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp" hidden />
        <button id="undo-button" class="icon-button" type="button" aria-label="撤销">↶</button>
        <button id="redo-button" class="icon-button" type="button" aria-label="重做">↷</button>
        <button id="export-button" class="primary-button" type="button">导出 PNG</button>
      </div>
    </header>

    <main id="workspace" class="workspace">
      <aside id="settings-content" class="settings-panel">
        <div class="panel-heading"><span>画布</span><button id="settings-close" class="icon-button drawer-close" type="button" aria-label="关闭设置">×</button></div>
        <section id="preview-content" class="preview-panel"><div class="panel-heading"><h2>实时对照</h2><span>LIVE</span></div><div class="live-preview"><figure><img id="live-original" alt="原图或空白画板预览" draggable="false" /><figcaption id="live-original-label">空白画板</figcaption></figure><figure><img id="live-grid" alt="网格结果预览" /><figcaption>网格结果</figcaption></figure></div><button id="crop-button" class="secondary-button preview-crop-button" type="button">裁切导入图像</button></section>
        <section class="settings-section">
          <div class="field-row"><label>行数<input id="rows-input" type="number" min="2" max="120" value="24" /></label><label>列数<input id="cols-input" type="number" min="2" max="120" value="24" /></label></div>
          <fieldset class="segmented" id="board-mode"><legend>画板形式</legend><label><input type="radio" name="board-mode" value="free" checked /><span>自由绘制</span></label><label><input type="radio" name="board-mode" value="fixed40" /><span>固定 40 色</span></label></fieldset>
          <div class="action-grid"><button id="blank-grid-button" class="secondary-button" type="button">新建空白画板</button><button id="import-button" class="secondary-button" type="button">导入图片</button></div>
        </section>
        <section class="settings-section">
          <div class="section-label">绘制工具</div>
          <fieldset class="tool-choice" id="edit-mode"><legend class="sr-only">绘制工具</legend><label><input type="radio" name="edit-mode" value="fill" checked /><span>填充</span></label><label><input type="radio" name="edit-mode" value="select" /><span>选择</span></label><label><input type="radio" name="edit-mode" value="eyedropper" /><span>吸管</span></label></fieldset>
          <label class="switch-row"><span>显示网格线</span><input id="gridlines-input" type="checkbox" checked /></label>
        </section>
        <details class="settings-section processing-section">
          <summary>图片生成与调整</summary>
          <p>上传图片后，可在此调整采样方式、色彩与映射结果。</p>
          <label>亮度<input id="brightness-input" type="range" min="-100" max="100" value="0" /></label><label>对比度<input id="contrast-input" type="range" min="-100" max="100" value="0" /></label><label>饱和度<input id="saturation-input" type="range" min="-100" max="100" value="0" /></label><label>色温<input id="temperature-input" type="range" min="-100" max="100" value="0" /></label><label>色调<input id="hue-adjust-input" type="range" min="-180" max="180" value="0" /></label>
          <label>取色方式<select id="sampling-input"><option value="direct">中心区域直接取色</option><option value="average">平均色</option><option value="dominant">主色</option></select></label><label>图案简化<select id="simplify-input"><option value="direct" selected>直接网格化</option><option value="lineart">黑白线稿</option><option value="none">精细色板映射</option><option value="light">轻度色块整理</option><option value="medium">中度色块整理</option><option value="strong">强度色块整理</option></select></label><label>颜色映射<select id="distance-input"><option value="ciede2000">CIEDE2000 色差</option><option value="oklab">OKLab 距离</option><option value="cielab">CIE Lab 距离</option><option value="weighted-rgb">加权 RGB 距离</option><option value="rgb">RGB 距离</option></select></label><label>颜色数量<div class="color-count-control"><select id="palette-colors-input"><option value="original" selected>保留全部直接颜色</option><option value="auto">自动</option><option value="8">8 色</option><option value="12">12 色</option><option value="16">16 色</option><option value="24">24 色</option><option value="32">32 色</option><option value="40">40 色</option><option value="48">48 色</option><option value="64">64 色</option><option value="custom">自定义</option></select><input id="palette-colors-custom" type="number" min="2" max="64" value="12" aria-label="自定义颜色数量" hidden /></div></label>
          <label class="switch-row"><span>细节优先</span><input id="detail-input" type="checkbox" checked /></label><label>尺寸处理<select id="fit-input"><option value="crop">按网格比例裁切</option><option value="contain">保留比例并补底色</option><option value="stretch" selected>拉伸填充网格</option></select></label><label>重采样<select id="resample-input"><option value="nearest">最近邻</option><option value="box">盒式平均</option><option value="bilinear">双线性</option><option value="bicubic">双三次</option><option value="lanczos" selected>Lanczos</option></select></label><label>透明色替换<input id="transparent-input" type="color" value="#f7f5ef" /></label>
          <button id="regenerate-button" class="primary-button full-button" type="button">重新生成</button>
        </details>
      </aside>
      <div id="settings-resize" class="resize-handle" role="separator" aria-label="调整设置区宽度" aria-orientation="vertical" tabindex="0"></div>

      <nav class="tool-rail" aria-label="快捷工具"><button id="settings-open" class="rail-button is-active" type="button" aria-label="画布设置">☷</button><label class="rail-button" for="image-input" aria-label="导入图片">▧</label><button class="rail-button edit-mode-button is-active" type="button" data-edit-mode="fill" aria-label="填充">▣</button><button class="rail-button edit-mode-button" type="button" data-edit-mode="select" aria-label="选择">⌖</button><button class="rail-button edit-mode-button" type="button" data-edit-mode="eyedropper" aria-label="吸管">⌾</button><span></span><button id="grid-toggle" class="rail-button" type="button" aria-label="显示或隐藏网格线">#</button></nav>

      <section class="canvas-panel">
        <div class="canvas-toolbar"><div><span class="eyebrow">CANVAS</span><strong>编辑画布</strong><span id="canvas-mode-label">自由绘制</span></div><div class="zoom-control"><span>缩放</span><input id="zoom-input" type="range" min="8" max="48" value="22" /><output id="zoom-value">22 px</output></div></div>
        <div class="canvas-scroll"><div class="canvas-shell"><canvas id="grid-canvas"></canvas></div></div><p id="workspace-status" class="status" aria-live="polite"></p>
      </section>

      <div id="sidebar-resize" class="resize-handle right-resize" role="separator" aria-label="调整右侧栏宽度" aria-orientation="vertical" tabindex="0"></div>
      <aside class="right-sidebar">
        <section class="palette-panel"><div class="panel-heading"><div><span class="eyebrow">COLOR INSPECTOR</span><h2 id="palette-title">自由色板</h2></div><span id="palette-count">13 色</span></div><p id="palette-description" class="palette-description">从当前颜色开始绘制，也可以从快捷色中选择。</p><label id="free-palette-controls" class="switch-row palette-manage"><span>编辑色板颜色</span><input id="palette-edit-input" type="checkbox" checked /></label><label id="fixed-palette-controls" class="switch-row palette-manage" hidden><span>管理可用颜色</span><input id="palette-manage-input" type="checkbox" /></label><div class="selected-color"><span id="color-swatch"></span><label><span id="selected-color-label">当前绘制颜色</span><input id="color-input" type="text" value="#e45a4f" maxlength="7" aria-label="当前颜色" /></label></div><div id="color-square" class="color-square" aria-label="饱和度和亮度选择区"><i id="color-square-handle"></i></div><input id="hue-input" class="hue-slider" type="range" min="0" max="360" value="4" aria-label="色相" /><div class="hue-indicator"><span id="hue-color-indicator"></span><output id="hue-value">4° · #E45A4F</output></div><div id="image-palette" class="palette active-palette" aria-label="当前画板色板"></div><div id="palette" class="palette quick-palette" aria-label="常用颜色"></div></section>
      </aside>
    </main>

    <dialog id="crop-dialog"><div class="dialog-head"><div><span class="eyebrow">GRID CROP</span><h2>按当前网格裁切</h2><p id="crop-grid-label">24 × 24 网格比例</p></div><button id="cancel-crop-button" class="icon-button" type="button" aria-label="关闭">×</button></div><canvas id="crop-canvas" width="640" height="420"></canvas><p class="crop-help">拖动框体选择区域，拖动四角或边中控点调整范围。框内网格将与当前画板一致。</p><div class="dialog-actions"><button id="apply-crop-button" class="primary-button" type="button">应用裁切</button></div></dialog>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
